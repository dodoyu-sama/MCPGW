server:
  client_id: "default"

audit:
  enabled: true
  driver: sqlite
  dsn: /data/mcpgw.db        # persisted via the compose volume mount ./data:/data

masking:
  enabled: true
  rules:
    - name: email
      patterns:
        - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
      mask_char: "***@***.com"
    - name: credit_card
      patterns:
        - '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
      mask_char: "****-****-****-****"
    - name: api_key
      patterns:
        - '\b(?:sk-|pk-|api[_-]?key|token)[-_A-Za-z0-9]{10,}\b'
      mask_char: "****"
    - name: id_card_cn
      patterns:
        - '\b\d{17}[\dXx]\b'
      mask_char: "*****************"
    - name: sensitive_fields
      fields: [password, passwd, pwd, secret, token, apiKey, api_key, cvv, card_cvv]
      mask_char: "****"

rate_limit:
  enabled: true
  qps: 10
  daily_quota: 10000

admin:
  enabled: true
  port: 8080
  token: "change-me"
